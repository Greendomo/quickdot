<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickDot 管理後台</title>
    <meta name="theme-color" content="#2f6f73" />
    <style>
      :root {
        color-scheme: light;
        --paper: #fdfbf7;
        --paper-soft: #f5f2e9;
        --ink: #1a1f2c;
        --muted: #6e7482;
        --line: rgba(26, 31, 44, 0.14);
        --accent: #d94a38;
        --ok: #2f6f73;
        --warn: #b76e00;
        --danger: #b8322a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 44px 0;
      }

      header,
      .toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      header {
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      h2 {
        font-size: 1rem;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      button,
      input {
        font: inherit;
      }

      .button,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      .danger {
        border-color: rgba(184, 50, 42, 0.26);
        color: var(--danger);
      }

      .toolbar {
        align-items: center;
        margin: 22px 0;
      }

      .status {
        min-height: 34px;
        color: var(--muted);
      }

      .login-card,
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
      }

      .login-card {
        display: grid;
        gap: 14px;
        width: min(520px, 100%);
        margin-top: 24px;
        padding: 20px;
      }

      .field {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .field input {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #fff;
        color: var(--ink);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        padding: 18px;
      }

      .metric-value {
        display: block;
        margin-top: 12px;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        font-weight: 900;
        line-height: 1;
      }

      .metric-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .section {
        margin-top: 26px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid rgba(26, 31, 44, 0.08);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      code {
        display: inline-block;
        max-width: 380px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hidden {
        display: none !important;
      }

      .ok {
        color: var(--ok);
      }

      .warn {
        color: var(--warn);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        main {
          padding: 30px 0;
        }

        header,
        .toolbar {
          display: block;
        }

        .button {
          margin-top: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>管理後台</h1>
          <p>只顯示系統統計與同步錯誤，不顯示使用者筆記內容。</p>
        </div>
        <a class="button" href="./index.html">回到 QuickDot</a>
      </header>

      <section class="login-card" id="loginPanel">
        <h2>管理員登入</h2>
        <label class="field">
          Email
          <input id="adminEmail" type="email" autocomplete="email" value="boyce3892846@gmail.com" />
        </label>
        <label class="field">
          密碼
          <input id="adminPassword" type="password" autocomplete="current-password" />
        </label>
        <div class="actions">
          <button class="primary" id="signInButton" type="button">登入後台</button>
          <a class="button" href="./health.html">本機健康檢查</a>
        </div>
        <p id="loginStatus" class="status">請使用已設為管理員的 Supabase 帳號登入。</p>
      </section>

      <section id="dashboard" class="hidden">
        <div class="toolbar">
          <p id="adminStatus" class="status"></p>
          <div class="actions">
            <button id="refreshButton" type="button">重新整理</button>
            <button class="danger" id="signOutButton" type="button">登出</button>
          </div>
        </div>

        <section class="grid" id="metricGrid" aria-live="polite"></section>

        <section class="section">
          <div class="section-heading">
            <h2>最近同步錯誤</h2>
            <p>最多顯示 25 筆</p>
          </div>
          <table>
            <thead>
              <tr>
                <th>時間</th>
                <th>使用者</th>
                <th>操作</th>
                <th>訊息</th>
                <th>細節</th>
              </tr>
            </thead>
            <tbody id="errorRows"></tbody>
          </table>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script>
      const els = {
        loginPanel: document.querySelector("#loginPanel"),
        dashboard: document.querySelector("#dashboard"),
        email: document.querySelector("#adminEmail"),
        password: document.querySelector("#adminPassword"),
        loginStatus: document.querySelector("#loginStatus"),
        adminStatus: document.querySelector("#adminStatus"),
        signIn: document.querySelector("#signInButton"),
        signOut: document.querySelector("#signOutButton"),
        refresh: document.querySelector("#refreshButton"),
        metrics: document.querySelector("#metricGrid"),
        errors: document.querySelector("#errorRows"),
      };

      const config = window.QUICKDOT_SUPABASE || {};
      const client = config.url && config.anonKey && window.supabase?.createClient
        ? window.supabase.createClient(config.url, config.anonKey)
        : null;

      function setStatus(message, type = "") {
        els.loginStatus.textContent = message;
        els.adminStatus.textContent = message;
        els.loginStatus.className = `status ${type}`;
        els.adminStatus.className = `status ${type}`;
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("zh-Hant-TW").format(Number(value || 0));
      }

      function formatDate(value) {
        if (!value) return "尚無紀錄";
        return new Intl.DateTimeFormat("zh-Hant-TW", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function metric(title, value, note = "") {
        return `
          <article class="card">
            <h2>${title}</h2>
            <span class="metric-value">${value}</span>
            <p class="metric-note">${note}</p>
          </article>
        `;
      }

      function showDashboard(show) {
        els.loginPanel.classList.toggle("hidden", show);
        els.dashboard.classList.toggle("hidden", !show);
      }

      async function signIn() {
        if (!client) {
          setStatus("Supabase 尚未設定，請先確認 supabase-config.js。", "warn");
          return;
        }
        setStatus("正在登入...", "");
        const { data, error } = await client.auth.signInWithPassword({
          email: els.email.value.trim(),
          password: els.password.value,
        });
        if (error) {
          setStatus(`登入失敗：${error.message}`, "warn");
          return;
        }
        els.password.value = "";
        await loadDashboard(data.session);
      }

      async function signOut() {
        if (!client) return;
        await client.auth.signOut();
        showDashboard(false);
        setStatus("已登出。", "");
      }

      async function loadDashboard(session) {
        if (!client) {
          setStatus("Supabase 尚未設定，請先確認 supabase-config.js。", "warn");
          return;
        }
        const activeSession = session || (await client.auth.getSession()).data.session;
        if (!activeSession) {
          showDashboard(false);
          setStatus("請使用管理員帳號登入。", "");
          return;
        }

        showDashboard(true);
        setStatus(`已登入：${activeSession.user.email}，正在讀取後台資料...`, "");

        const [{ data: overview, error: overviewError }, { data: errors, error: errorsError }] = await Promise.all([
          client.rpc("quickdot_admin_overview"),
          client.rpc("quickdot_admin_recent_sync_errors", { limit_count: 25 }),
        ]);

        if (overviewError || errorsError) {
          showDashboard(false);
          const message = overviewError?.message || errorsError?.message || "未知錯誤";
          setStatus(`無法讀取管理後台：${message}`, "warn");
          return;
        }

        renderOverview(overview || {});
        renderErrors(errors || []);
        setStatus(`已登入：${activeSession.user.email}。最後更新：${formatDate(new Date().toISOString())}`, "ok");
      }

      function renderOverview(data) {
        els.metrics.innerHTML = [
          metric("總使用者", formatNumber(data.totalUsers), `今日新增 ${formatNumber(data.newUsersToday)}`),
          metric("7 日活躍", formatNumber(data.activeUsers7d), "依同步變更紀錄估算"),
          metric("目前紀錄", formatNumber(data.totalEntries), `刪除保留 ${formatNumber(data.deletedEntries)}`),
          metric("24h 同步變更", formatNumber(data.changes24h), `最後更新 ${formatDate(data.latestEntryUpdate)}`),
          metric("24h 同步錯誤", formatNumber(data.syncErrors24h), `7 日共 ${formatNumber(data.syncErrors7d)}`),
          metric("最後錯誤", data.latestSyncError ? "有紀錄" : "無", formatDate(data.latestSyncError)),
        ].join("");
      }

      function renderErrors(errors) {
        els.errors.innerHTML = errors.length
          ? errors.map((item) => `
              <tr>
                <td>${formatDate(item.created_at)}</td>
                <td>${escapeHtml(item.email || "unknown")}</td>
                <td><code>${escapeHtml(item.operation || "sync")}</code></td>
                <td>${escapeHtml(item.message || "")}</td>
                <td><code>${escapeHtml(JSON.stringify(item.details || {}))}</code></td>
              </tr>
            `).join("")
          : '<tr><td colspan="5">目前沒有同步錯誤。</td></tr>';
      }

      els.signIn.addEventListener("click", signIn);
      els.signOut.addEventListener("click", signOut);
      els.refresh.addEventListener("click", () => loadDashboard());
      els.password.addEventListener("keydown", (event) => {
        if (event.key === "Enter") signIn();
      });

      if (!client) {
        setStatus("Supabase 尚未設定，請先確認 supabase-config.js。", "warn");
      } else {
        client.auth.getSession().then(({ data }) => loadDashboard(data.session));
        client.auth.onAuthStateChange((_event, session) => {
          if (session) loadDashboard(session);
        });
      }
    </script>
  </body>
</html>
