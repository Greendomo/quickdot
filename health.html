<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickDot 健康檢查</title>
    <meta name="theme-color" content="#2f6f73" />
    <style>
      :root {
        color-scheme: light;
        --paper: #fdfbf7;
        --paper-soft: #f5f2e9;
        --ink: #1a1f2c;
        --muted: #6e7482;
        --line: rgba(26, 31, 44, 0.14);
        --accent: #d94a38;
        --ok: #2f6f73;
        --warn: #b76e00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: 18px;
      }

      .card h2 {
        margin: 0 0 14px;
        font-size: 1rem;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-top: 1px solid rgba(26, 31, 44, 0.08);
      }

      .metric:first-of-type {
        border-top: 0;
      }

      .metric span:first-child {
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--paper-soft);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .ok {
        color: var(--ok);
      }

      .warn {
        color: var(--warn);
      }

      .error-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .error-item {
        padding: 12px;
        border-radius: 8px;
        background: var(--paper-soft);
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 720px) {
        main {
          padding: 32px 0;
        }

        header {
          display: block;
        }

        .button {
          margin-top: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>健康檢查</h1>
          <p>這個頁面只讀取本機狀態，用來快速確認資料量、同步佇列與離線能力，不會修改或上傳資料。</p>
        </div>
        <a class="button" href="./index.html">回到 QuickDot</a>
      </header>

      <section class="grid" id="healthGrid" aria-live="polite"></section>
    </main>

    <script src="./supabase-config.js"></script>
    <script>
      const keys = {
        storage: "quickdot-app-v1",
        syncMeta: "quickdot-sync-meta-v1",
        syncQueue: "quickdot-sync-queue-v1",
        syncErrors: "quickdot-sync-errors-v1",
      };

      function readJson(key, fallback) {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : fallback;
        } catch {
          return fallback;
        }
      }

      function asArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function statusText(ok, goodText, warnText) {
        return `<strong class="${ok ? "ok" : "warn"}">${ok ? goodText : warnText}</strong>`;
      }

      function metric(label, value) {
        return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
      }

      async function getServiceWorkerStatus() {
        if (!("serviceWorker" in navigator)) return "不支援";
        const registration = await navigator.serviceWorker.getRegistration("./");
        return registration ? "已註冊" : "尚未註冊";
      }

      async function render() {
        const payload = readJson(keys.storage, {});
        const entries = asArray(payload.entries || payload);
        const deletedEntries = asArray(payload.deletedEntries);
        const syncQueue = asArray(readJson(keys.syncQueue, []));
        const syncErrors = asArray(readJson(keys.syncErrors, []));
        const syncMeta = readJson(keys.syncMeta, {});
        const supabaseConfig = window.QUICKDOT_SUPABASE || {};
        const serviceWorker = await getServiceWorkerStatus();
        const grid = document.querySelector("#healthGrid");

        const errorItems = syncErrors.slice(0, 5).map((item) => {
          const created = item.createdAt ? new Date(item.createdAt).toLocaleString() : "未知時間";
          return `<div class="error-item"><strong>${item.operation || "sync"}</strong><br />${item.message || "Unknown error"}<br /><span>${created}</span></div>`;
        });

        grid.innerHTML = `
          <article class="card">
            <span class="pill">本機資料</span>
            <h2>資料狀態</h2>
            ${metric("紀錄數量", entries.length)}
            ${metric("刪除保留紀錄", deletedEntries.length)}
            ${metric("資料版本", payload.schemaVersion || "舊版/未建立")}
          </article>

          <article class="card">
            <span class="pill">同步</span>
            <h2>雲端狀態</h2>
            ${metric("Supabase 設定", statusText(Boolean(supabaseConfig.url && supabaseConfig.anonKey), "已填入", "尚未填入"))}
            ${metric("待同步變更", syncQueue.length)}
            ${metric("本機是否待上傳", syncMeta.localDirty ? "是" : "否")}
            ${metric("最後同步", syncMeta.lastSyncAt ? new Date(syncMeta.lastSyncAt).toLocaleString() : "尚無紀錄")}
          </article>

          <article class="card">
            <span class="pill">PWA</span>
            <h2>離線能力</h2>
            ${metric("瀏覽器連線", navigator.onLine ? "線上" : "離線")}
            ${metric("Service Worker", serviceWorker)}
            ${metric("Cache API", "caches" in window ? "支援" : "不支援")}
          </article>

          <article class="card">
            <span class="pill">診斷</span>
            <h2>最近同步錯誤</h2>
            ${metric("本機錯誤佇列", syncErrors.length)}
            <div class="error-list">${errorItems.join("") || "<p>目前沒有保留中的同步錯誤。</p>"}</div>
          </article>
        `;
      }

      render();
    </script>
  </body>
</html>
